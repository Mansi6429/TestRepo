<!DOCTYPE html>
<html>

<body>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
        // find the length
        const fruits = ["Banana", "Orange", "Apple", "Mango"];
        let size = fruits.length;
        document.getElementById("demo").innerHTML = "Length of Array:" + size;

        // toString
        const fruits1 = ["Banana", "Orange", "Apple", "Mango"];
        let myList = fruits1.toString();
        document.getElementById("demo1").innerHTML = "returns the elements of an array as a comma separated string:" + myList;

        // At()
        const fru = ["Banana", "Orange", "Apple", "Mango"];
        let fruit = fru.at(3);
        document.getElementById("demo2").innerHTML = "at() method returns an indexed element from an array:" + fruit;

        // join()
        const color = ["red", "white", "pink", "orange"];
        document.getElementById("demo3").innerHTML = "joins array elements into a string:" + color.join(" * ");
    </script>

</body>

</html>
