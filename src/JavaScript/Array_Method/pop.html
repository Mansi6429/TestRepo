<!DOCTYPE html>
<html>

<body>

    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>

    <script>
        // pop()
        const fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("demo1").innerHTML = fruits;
        fruits.pop();
        document.getElementById("demo2").innerHTML = "removes the last element from an array:" + fruits;

        // push()
        const color = ["red", "black", "pink", "green"];
        document.getElementById("demo3").innerHTML = color;
        color.push("yellow");
        document.getElementById("demo4").innerHTML = "add new element:" + color;
    </script>

</body>

</html>
